[project]
name = "slurmpy"
version = "0.1.0"
description = "Slurm API integration library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
